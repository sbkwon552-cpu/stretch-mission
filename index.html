<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손목, 어깨 보호 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="icon">🤝</div>
            <h1>손목, 어깨 보호 앱</h1>
            <p>일을 하거나 손목을 많이 쓸 때 스트레칭을 할 수 있게 도와줍니다.</p>
        </header>

        <main class="card">
            <div id="mission-area">
                <div class="mission-placeholder">
                    <span class="placeholder-icon">☀️</span>
                    <p>버튼을 눌러 스트레칭 미션을 받아보세요!</p>
                </div>
            </div>

            <div class="button-group">
                <button id="draw-btn" class="btn-primary">🎲 미션 뽑기</button>
                <button id="complete-btn" class="btn-success" disabled>✅ 미션 완료</button>
            </div>
        </main>

        <section class="stats">
            <p>오늘 완료한 미션: <strong id="count-display">0</strong>회</p>
        </section>

        <footer>
            <p>※ 이 앱은 생활습관 참고용입니다. 통증이 심할 경우 의료기관을 방문하세요.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
